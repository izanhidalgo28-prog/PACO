<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de Citas — Clínica Vicente Pascual</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f7f4;min-height:100vh}
#login{display:flex;align-items:center;justify-content:center;min-height:100vh}
.login-box{background:#fff;border-radius:16px;padding:40px;width:320px;box-shadow:0 4px 20px rgba(0,0,0,.1);text-align:center}
.login-box h1{color:#1a6b4a;font-size:20px;margin-bottom:8px}
.login-box p{color:#777;font-size:13px;margin-bottom:24px}
.login-box input{width:100%;border:1.5px solid #ddd;border-radius:8px;padding:10px 14px;font-size:14px;outline:none;margin-bottom:12px}
.login-box input:focus{border-color:#1a6b4a}
.login-box button{width:100%;background:#1a6b4a;color:#fff;border:none;border-radius:8px;padding:11px;font-size:14px;font-weight:600;cursor:pointer}
.login-box button:hover{background:#0f4a32}
.error{color:#e74c3c;font-size:12px;margin-top:8px}
#panel{display:none;padding:20px}
header{background:#1a6b4a;color:#fff;padding:16px 24px;border-radius:12px;display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
header h1{font-size:18px}
header button{background:rgba(255,255,255,.2);color:#fff;border:none;border-radius:8px;padding:6px 14px;cursor:pointer;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat{background:#fff;border-radius:12px;padding:16px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.stat .n{font-size:28px;font-weight:700;color:#1a6b4a}
.stat .l{font-size:12px;color:#777;margin-top:4px}
.filtros{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.filtro{background:#fff;border:1.5px solid #ddd;border-radius:20px;padding:6px 14px;font-size:12px;cursor:pointer;font-family:inherit}
.filtro.active{border-color:#1a6b4a;background:#e8f5ee;color:#1a6b4a;font-weight:600}
table{width:100%;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06);border-collapse:collapse}
th{background:#1a6b4a;color:#fff;padding:12px 14px;font-size:12px;font-weight:500;text-align:left}
td{padding:12px 14px;font-size:13px;border-bottom:1px solid #f0f0f0;color:#333}
tr:last-child td{border-bottom:none}
tr:hover td{background:#f9fffe}
.estado{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;display:inline-block}
.estado.Pendiente{background:#fff3cd;color:#856404}
.estado.Confirmada{background:#d1e7dd;color:#0a3622}
.estado.Cancelada{background:#f8d7da;color:#842029}
.estado.Completada{background:#cfe2ff;color:#084298}
select.est-sel{border:1px solid #ddd;border-radius:6px;padding:4px 8px;font-size:11px;cursor:pointer;outline:none}
.refresh{background:#1a6b4a;color:#fff;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:13px;margin-bottom:16px}
.vacio{text-align:center;padding:40px;color:#aaa;font-size:14px}
</style>
</head>
<body>

<div id="login">
  <div class="login-box">
    <h1>🏥 Panel de Citas</h1>
    <p>Clínica Vicente Pascual</p>
    <input id="user" type="text" placeholder="Usuario"/>
    <input id="pass" type="password" placeholder="Contraseña"/>
    <button onclick="entrar()">Entrar</button>
    <div class="error" id="err"></div>
  </div>
</div>

<div id="panel">
  <header>
    <h1>🏥 Panel de Citas — Clínica Vicente Pascual</h1>
    <button onclick="salir()">Cerrar sesión</button>
  </header>

  <div class="stats">
    <div class="stat"><div class="n" id="s-total">0</div><div class="l">Total citas</div></div>
    <div class="stat"><div class="n" id="s-pend" style="color:#856404">0</div><div class="l">Pendientes</div></div>
    <div class="stat"><div class="n" id="s-conf" style="color:#0a3622">0</div><div class="l">Confirmadas</div></div>
    <div class="stat"><div class="n" id="s-canc" style="color:#842029">0</div><div class="l">Canceladas</div></div>
  </div>

  <button class="refresh" onclick="cargarCitas()">↻ Actualizar</button>

  <div class="filtros">
    <button class="filtro active" onclick="filtrar('Todas',this)">Todas</button>
    <button class="filtro" onclick="filtrar('Pendiente',this)">Pendientes</button>
    <button class="filtro" onclick="filtrar('Confirmada',this)">Confirmadas</button>
    <button class="filtro" onclick="filtrar('Cancelada',this)">Canceladas</button>
    <button class="filtro" onclick="filtrar('Completada',this)">Completadas</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Fecha</th>
        <th>Nombre</th>
        <th>Servicio</th>
        <th>Día</th>
        <th>Horario</th>
        <th>Teléfono</th>
        <th>Estado</th>
      </tr>
    </thead>
    <tbody id="tabla"></tbody>
  </table>
</div>

<script>
var SHEETS_URL = 'https://script.google.com/macros/s/AKfycbxNJTkjcBXCG7JGMWNPy1pqglZiHOwqek8nBUu9xYGB3X0gm-soUohxkEnIKx8opORy/exec';
var USUARIO = 'clinica';
var PASSWORD = 'vicente2024';
var todasCitas = [];
var filtroActual = 'Todas';

function entrar() {
  var u = document.getElementById('user').value;
  var p = document.getElementById('pass').value;
  if (u === USUARIO && p === PASSWORD) {
    document.getElementById('login').style.display = 'none';
    document.getElementById('panel').style.display = 'block';
    cargarCitas();
  } else {
    document.getElementById('err').textContent = 'Usuario o contraseña incorrectos';
  }
}

function salir() {
  document.getElementById('login').style.display = 'flex';
  document.getElementById('panel').style.display = 'none';
  document.getElementById('user').value = '';
  document.getElementById('pass').value = '';
}

async function cargarCitas() {
  try {
    var r = await fetch(SHEETS_URL);
    todasCitas = await r.json();
    actualizarStats();
    renderTabla(filtroActual);
  } catch(e) {
    console.error(e);
  }
}

function actualizarStats() {
  document.getElementById('s-total').textContent = todasCitas.length;
  document.getElementById('s-pend').textContent = todasCitas.filter(c=>c.estado==='Pendiente').length;
  document.getElementById('s-conf').textContent = todasCitas.filter(c=>c.estado==='Confirmada').length;
  document.getElementById('s-canc').textContent = todasCitas.filter(c=>c.estado==='Cancelada').length;
}

function renderTabla(filtro) {
  var tbody = document.getElementById('tabla');
  var citas = filtro === 'Todas' ? todasCitas : todasCitas.filter(c=>c.estado===filtro);
  if (citas.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7" class="vacio">No hay citas para mostrar</td></tr>';
    return;
  }
  tbody.innerHTML = citas.map(function(c) {
    return '<tr>'+
      '<td>'+c.fecha+'</td>'+
      '<td><strong>'+c.nombre+'</strong></td>'+
      '<td>'+c.tratamiento+'</td>'+
      '<td>'+c.dia+'</td>'+
      '<td>'+c.hora+'</td>'+
      '<td><a href="tel:'+c.telefono+'">'+c.telefono+'</a></td>'+
      '<td>'+
        '<select class="est-sel" onchange="cambiarEstado('+c.fila+',this.value)">'+
          ['Pendiente','Confirmada','Cancelada','Completada'].map(function(e){
            return '<option'+(e===c.estado?' selected':'')+'>'+e+'</option>';
          }).join('')+
        '</select>'+
      '</td>'+
    '</tr>';
  }).join('');
}

function filtrar(f, btn) {
  filtroActual = f;
  document.querySelectorAll('.filtro').forEach(function(b){b.classList.remove('active')});
  btn.classList.add('active');
  renderTabla(f);
}

async function cambiarEstado(fila, estado) {
  try {
    await fetch(SHEETS_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({accion:'actualizar', fila:fila, estado:estado})
    });
    await cargarCitas();
  } catch(e) {
    console.error(e);
  }
}

document.getElementById('user').addEventListener('keydown', function(e){if(e.key==='Enter')entrar()});
document.getElementById('pass').addEventListener('keydown', function(e){if(e.key==='Enter')entrar()});
</script>
</body>
</html>
